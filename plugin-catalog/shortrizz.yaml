version: "0.6.0"
description: >-
  Skill id shortrizz:shortrizz-clipper. Shortrizz is a self-hosted AI clipper,
  a sibling of Comfyrizz: give it a long video URL or file and it downloads it,
  transcribes it on CPU with faster-whisper, picks the best 30-60 s moments with
  an LLM (OPENCODE_GO_API_KEY via the Hermes secret scope, or a built-in heuristic), reframes
  16:9 to 9:16 with face tracking, burns in word-by-word captions (Hormozi,
  MrBeast, Abdaal or custom styles), tightens dead air, removes fillers and
  false starts with a validated AI edit pass, adds a hook line, normalises
  loudness and keeps text in platform safe zones and off faces. Every export opens
  on a money shot: frame 0 is the strongest finished frame, with the hook already
  readable, so the file works as a thumbnail. Opt-in effects:
  cold open, AI narrator intro/outro, punch-in zooms, loop endings, emoji and
  sound effects; optional watermark. It can also build one 16:9 highlights
  video from the top-scoring moments (no vertical crop). Writes clips.json plus
  a gallery. Renders run as background jobs; poll shortrizz_status. Publishing
  is a dry-run plan only; nothing is uploaded. Only clip content you have rights to.
maintainer: mojomast
