known_issues:
  - "Agent tools default to an offline practice simulation; set network_enabled (plugin setting) to play the real shared game with the pane's paired account. pet rename/set_mode are sim-only. Online pair approve/revoke is pane-only (tool returns unsupported_online)."
  - "Multiplayer (ranked battles, leaderboard, social) needs a game server; the hosted API has a signup cap and no self-serve account deletion yet."
capabilities:
  provides_tools:
    - hermagotchi_status
    - hermagotchi_pet
    - hermagotchi_goals
    - hermagotchi_challenge
    - hermagotchi_battle
    - hermagotchi_shop
    - hermagotchi_social
    - hermagotchi_meta
  provides_hooks: []
  provides_middleware: []
  requires_env: []
