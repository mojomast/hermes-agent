name: hermagotchi
title: Hermagotchi
repo: https://github.com/mojomast/hermagotchi
sha: 0ed7793fbf238e32fb86506ad2b587ae4eb90963
description: >-
  Hermagotchi: co-op virtual pets for Hermes. Raise a pet, fight async battles,
  earn Bits, collect cosmetics and trade taunts with other players, from chat or
  a native pane. The pane in the Hermes web app and Desktop has Habitat, Battle,
  Shop, Leaderboard and Social tabs plus a persistent lobby rail. Adopt one of
  10 species and keep its fullness, happiness, energy and health up; fight
  deterministic async battles (practice against Teknium, or PvP); spend Bits on
  85 cosmetics up to mythic tier; climb a seasonal leaderboard; and chat, DM,
  challenge and taunt other players. Hermes gets 8 composable tools
  (hermagotchi_status, hermagotchi_pet, hermagotchi_goals,
  hermagotchi_challenge, hermagotchi_battle, hermagotchi_shop,
  hermagotchi_social, hermagotchi_meta), so the agent can check on and care for
  your pet, set goals, read the lobby and run practice battles when you allow
  it. It is for anyone who wants a small shared game inside Hermes, played by
  hand or with the agent's help. To start, on Hermes 0.23.0 or newer run hermes
  plugins install hermagotchi and hermes plugins enable hermagotchi, open the
  Hermagotchi pane, and ask Hermes to adopt a pet. The tools begin in an offline
  practice simulation. To play the shared game, pair a device in the pane
  against the optional hosted API or a server you run from docs/deploy, then
  turn on the network_enabled plugin setting. Disclosure — offline by default:
  the tools run an offline practice simulation (in-memory, no network, reset on
  Hermes restart). Only when the owner sets the network_enabled plugin setting
  do they act on the real game server, using the device session the pane paired;
  that state persists server-side. hermagotchi_status health/me report the
  active backend. Agent autonomy (autonomy-gated game actions such as practice
  battles) and agent chat need their own settings and are off by default; the
  agent can never buy items, and pet care/adopt are not gated by the autonomy
  setting. The network, autonomy and chat settings can also be switched on by
  the HERMAGOTCHI_NETWORK_ENABLED, HERMAGOTCHI_AGENT_AUTONOMY_ENABLED and
  HERMAGOTCHI_AGENT_CHAT_ENABLED environment variables. Disclosure — network:
  traffic goes over HTTPS only (plain HTTP is refused except loopback) to the
  game API base URL the user configures (the optional hosted API at
  api.hermagotchi.rizz.click run by the maintainer, or a self-hosted server from
  docs/deploy). It sends pet, battle, shop and social actions and, if agent chat
  is enabled, lobby messages, DMs and taunts, which that server stores; other
  players' messages come back to the agent marked as third-party text.
  Disclosure — pairing and pane: the pairing session token lives in a 0600 file
  under Hermes plugin data and is never returned by tools or logged. Online,
  hermagotchi_status op=pair refuses user_code/revoke_device_id
  (unsupported_online); approve and revoke stay human pane actions so lobby/DM
  prompt injection cannot attach a stranger's device. The dashboard tab renders
  with the dashboard SDK's React and authedFetch, used only for same-origin
  plugin asset and API routes; the Desktop pane uses ctx.rest only (no remote
  code, no host-token access). No hooks, no middleware, no subprocesses, no
  inbound ports, and no secrets are requested (requires_env is empty). The
  dashboard plugin API only proxies an allowlisted set of game routes for the
  pane.
